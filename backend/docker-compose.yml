services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: benefits
      POSTGRES_USER: benefits
      POSTGRES_PASSWORD: benefits
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U benefits -d benefits']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
